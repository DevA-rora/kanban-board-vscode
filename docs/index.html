<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Bento is a minimal Kanban board VS Code extension for todo.md.">
	<title>Bento</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-white">
	<div class="gradient-bg" aria-hidden="true">
		<div class="gradient-blob gradient-blob--blue"></div>
		<div class="gradient-blob gradient-blob--green"></div>
		<div class="gradient-blob gradient-blob--white"></div>
	</div>

	<main class="min-h-screen flex items-center justify-center px-4 py-12">
		<div class="w-full max-w-3xl rounded-2xl border border-white/20 bg-white/10 p-8 shadow-2xl backdrop-blur-xl sm:p-10">
			<h1 class="text-center text-5xl font-bold tracking-tight sm:text-6xl">Bento</h1>

			<p class="mx-auto mt-4 max-w-xl text-center text-base leading-relaxed text-white/90 sm:text-lg">
				A Kanban board built into VS Code. Edit your <code class="rounded bg-white/15 px-1.5 py-0.5 text-sm">todo.md</code> like Trello and save it as plain markdown in your repo.
			</p>

			<div class="mt-6 flex flex-wrap items-center justify-center gap-2">
				<a class="badge-link" href="https://marketplace.visualstudio.com/items?itemName=DevArora.bento" target="_blank" rel="noopener noreferrer">
					<img src="https://img.shields.io/badge/VS%20Marketplace-Install-007ACC?logo=visualstudiocode" alt="Install from VS Code Marketplace">
				</a>
				<a class="badge-link" href="https://open-vsx.org/extension/DevArora/bento" target="_blank" rel="noopener noreferrer">
					<img src="https://img.shields.io/badge/Open%20VSX-Install-6B4FBB" alt="Install from Open VSX">
				</a>
				<a class="badge-link" href="https://github.com/DevA-rora/Bento/releases" target="_blank" rel="noopener noreferrer">
					<img src="https://img.shields.io/badge/version-1.0.0-blue" alt="Version 1.0.0">
				</a>
				<a class="badge-link" href="https://github.com/DevA-rora/Bento/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">
					<img src="https://img.shields.io/badge/License-MIT-blue.svg" alt="MIT License">
				</a>
				<a class="badge-link" href="https://github.com/DevA-rora/Bento" target="_blank" rel="noopener noreferrer">
					<img src="https://img.shields.io/github/last-commit/DevA-rora/Bento" alt="Last commit">
				</a>
			</div>

			<section class="mt-8" aria-label="Bento screenshots and demo">
				<div class="relative rounded-xl border border-white/15 bg-black/20 p-3 sm:p-4">
					<div class="carousel-viewport overflow-hidden rounded-lg">
						<div class="carousel-slide active" aria-hidden="false">
							<img src="assets/bento_demo_v1.gif" alt="Bento demo showing drag-and-drop, editing, and theme support">
						</div>
						<div class="carousel-slide" aria-hidden="true">
							<img src="assets/screenshot_1.png" alt="todo.md rendered as a Bento kanban board">
						</div>
						<div class="carousel-slide" aria-hidden="true">
							<img src="assets/screenshot_2.png" alt="Bento board adapting to different VS Code themes">
						</div>
					</div>

					<button
						id="carousel-prev"
						type="button"
						class="carousel-btn absolute left-2 top-1/2 -translate-y-1/2 rounded-full border border-white/20 bg-white/15 px-3 py-2 text-lg font-semibold backdrop-blur hover:bg-white/25"
						aria-label="Previous slide"
					>
						&#8592;
					</button>
					<button
						id="carousel-next"
						type="button"
						class="carousel-btn absolute right-2 top-1/2 -translate-y-1/2 rounded-full border border-white/20 bg-white/15 px-3 py-2 text-lg font-semibold backdrop-blur hover:bg-white/25"
						aria-label="Next slide"
					>
						&#8594;
					</button>
				</div>

				<p id="carousel-indicator" class="mt-3 text-center text-sm text-white/70">1 / 3</p>
			</section>

			<p class="mt-6 text-center text-sm text-white/70">
				<a class="underline decoration-white/40 underline-offset-4 hover:text-white" href="https://github.com/DevA-rora/Bento" target="_blank" rel="noopener noreferrer">View source on GitHub</a>
			</p>
		</div>
	</main>

	<script src="script.js"></script>
</body>
</html>
